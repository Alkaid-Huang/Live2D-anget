# Echo 配置文件
# 修改 vad_type 即可切换 VAD 后端，无需改代码

vad_config:
  # 可选: "silero_vad"（真实现）, "mock_vad"（假实现）, "none"（禁用）
  vad_type: "silero_vad"

  silero:
    prob_threshold: 0.5
    db_threshold: -20.0       # float32 音频用负数（见课题06.1 坑7）
    required_hits: 3           # 连续命中 3 次确认开口（3×32ms≈0.1s）
    required_misses: 24        # 连续未命中 24 次确认说完（24×32ms≈0.77s）
    smoothing_window: 5        # 滑动窗口平滑
    pre_buffer_size: 20        # 预缓冲帧数（防切头）
    window_size_samples: 512   # silero-vad 每帧 512 采样点

# 06.4 新增：ASR 配置
asr_config:
  # 可选: "sherpa_onnx"（SenseVoice）, "faster_whisper"（Whisper）, "mock_asr"（假实现）, "none"（禁用）
  asr_type: "mock_asr"

  sherpa_onnx:
    # SenseVoice 是单模型文件：model.onnx + tokens.txt（字段名对齐真实源码）
    model_path: "models/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17/model.int8.onnx"
    tokens: "models/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17/tokens.txt"
    num_threads: 4
    use_itn: true
    provider: "cpu"

  faster_whisper:
    # model_path 可以是模型名（small），也可以是本地模型路径
    model_path: "small"
    download_root: "models/whisper"
    language: "zh"
    device: "auto"
    compute_type: "int8"
    prompt:   # initial_prompt，留空 = 不加提示（语言应与音频一致）
