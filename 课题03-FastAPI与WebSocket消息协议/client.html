<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>Echo 客户端测试</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 50px auto; }
        #log { background: #1e1e1e; color: #0f0; padding: 15px; height: 300px;
               overflow-y: auto; font-family: monospace; font-size: 13px; white-space: pre-wrap; }
        input { width: 70%; padding: 8px; }
        button { margin: 5px; padding: 8px 16px; cursor: pointer; }
        .status { color: #888; font-size: 12px; }
    </style>
</head>
<body>
    <h2>Echo WebSocket 测试</h2>
    <p class="status" id="status">未连接</p>
    <input id="input" type="text" placeholder="输入消息...">
    <button onclick="sendText()">发送文字</button>
    <button onclick="sendControl('start')">开始录音</button>
    <button onclick="sendControl('stop')">停止录音</button>
    <button onclick="sendPing()">心跳</button>
    <button onclick="sendBadJson()">发非法JSON</button>
    <div id="log"></div>

    <script>
        const log = document.getElementById("log");
        const status = document.getElementById("status");
        const ws = new WebSocket("ws://localhost:8000/ws");

        ws.onopen = () => {
            status.textContent = "已连接";
            status.style.color = "green";
            log.textContent += "已连接到服务器\n";
        };

        ws.onclose = () => {
            status.textContent = "已断开";
            status.style.color = "red";
            log.textContent += "连接已断开\n";
        };

        ws.onmessage = (event) => {
            const msg = JSON.parse(event.data);
            const color = msg.type === "error" ? "color: #f66" : "color: #6cf";
            log.textContent += `收到 → <span style="${color}">[${msg.type}]</span> ${JSON.stringify(msg)}\n`;
        };

        function send(msg) { ws.send(JSON.stringify(msg)); }

        function sendText() {
            const text = document.getElementById("input").value || "空消息";
            send({ type: "text", content: text });
            log.textContent += `发送 → [text] ${text}\n`;
        }

        function sendControl(action) {
            send({ type: "control", action: action });
            log.textContent += `发送 → [control] ${action}\n`;
        }

        function sendPing() {
            send({ type: "ping" });
            log.textContent += `发送 → [ping]\n`;
        }

        function sendBadJson() {
            ws.send("这不是JSON");
            log.textContent += `发送 → [非法JSON]\n`;
        }
    </script>
</body>
</html>
